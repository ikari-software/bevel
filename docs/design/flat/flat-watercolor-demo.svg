<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
  <title id="title">Bevel Flat — Whistler Watercolor design spec</title>
  <desc id="desc">A vector target for Bevel Flat: a high-DPI recreation of the Windows Whistler Watercolor / Classic Shell skin, with aqua-white chrome, thin frame, small rounded caption controls, and clear list-header and separator treatment.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFA"/><stop offset="1" stop-color="#E9F1F1"/></linearGradient>
    <linearGradient id="desk" x2="0" y2="1"><stop offset="0" stop-color="#D9ECE7"/><stop offset="1" stop-color="#C6E0DC"/></linearGradient>
    <linearGradient id="caption" x2="0" y2="1"><stop offset="0" stop-color="#E4F3F5"/><stop offset=".28" stop-color="#C7E5EA"/><stop offset=".7" stop-color="#A5D4DE"/><stop offset="1" stop-color="#8EC7D4"/></linearGradient>
    <linearGradient id="inactive" x2="0" y2="1"><stop offset="0" stop-color="#EDF3F3"/><stop offset="1" stop-color="#DDE8E9"/></linearGradient>
    <linearGradient id="button" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F1F7F7"/><stop offset="1" stop-color="#E1EDEF"/></linearGradient>
    <linearGradient id="hover" x2="0" y2="1"><stop offset="0" stop-color="#FFF9E8"/><stop offset=".55" stop-color="#F8E5B5"/><stop offset="1" stop-color="#F1D296"/></linearGradient>
    <linearGradient id="selection" x2="0" y2="1"><stop offset="0" stop-color="#B7E0E9"/><stop offset="1" stop-color="#9ACEDF"/></linearGradient>
    <linearGradient id="field" x2="0" y2="1"><stop offset="0" stop-color="#EDF5F6"/><stop offset=".18" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="taskbar" x2="0" y2="1"><stop offset="0" stop-color="#C9E6EC"/><stop offset=".08" stop-color="#B6DDE5"/><stop offset=".5" stop-color="#A4D2DE"/><stop offset=".92" stop-color="#B6DDE5"/><stop offset="1" stop-color="#C9E6EC"/></linearGradient>
    <linearGradient id="start" x2="0" y2="1"><stop offset="0" stop-color="#D6EACB"/><stop offset=".55" stop-color="#AED69E"/><stop offset="1" stop-color="#87C584"/></linearGradient>
    <linearGradient id="progress" x2="1" y2="0"><stop offset="0" stop-color="#C6E7DD"/><stop offset=".5" stop-color="#9BCFBD"/><stop offset="1" stop-color="#77B7A8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/><feOffset dy="7" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 .11 0 0 0 0 .18 0 0 0 0 .2 0 0 0 .16 0" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.ink{fill:#1B3850}.soft{fill:#6B7F86}.micro{font:600 10px/1.2 Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif;letter-spacing:1.4px}.ui{font:13px/1.3 Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif}.small{font:12px/1.3 Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif}.label{font:600 12px/1.3 Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif}.tiny{font:10.5px/1.3 Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif}</style>
  </defs>
  <rect width="1280" height="1160" fill="url(#page)"/>
  <text x="56" y="70" class="micro soft">BEVEL / DESIGN SPEC</text>
  <text x="56" y="112" fill="#1B3850" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="38" font-weight="620" letter-spacing="-1.4">Flat, as Whistler watercolor.</text>
  <text x="58" y="139" class="ui soft">A faithful, antialiased, vector recreation: white/aqua chrome, blue-green ink, thin frame, soft color transitions.</text>

  <rect x="48" y="170" width="1184" height="710" rx="16" fill="#FCFDFD" stroke="#C9DDE0"/>
  <rect x="60" y="182" width="1160" height="686" rx="12" fill="url(#desk)"/>
  <path d="M60 182h480c-45 42-118 54-204 47-94-8-161 30-226 24-26-2-40-10-50-19Z" fill="#F2B9B8" opacity=".18"/>
  <path d="M1018 182h202v348c-70-32-104-51-164-40-67 12-84-25-142-34 29-63 42-158 104-274Z" fill="#D6C7ED" opacity=".16"/>
  <path d="M60 712c114-48 205-47 298-12 75 28 111 72 202 84-84 60-320 83-500 84Z" fill="#B9DEC0" opacity=".22"/>

