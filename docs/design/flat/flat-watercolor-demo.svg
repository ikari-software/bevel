    <!-- list area -->
    <rect x="271" y="384" width="788" height="319" fill="#FFFFFF"/>
    <rect x="271" y="384" width="788" height="26" fill="#DCECEF"/>
    <path d="M270 410h790" stroke="#AFCED3"/>
    <path d="M540 384v26M720 384v26M900 384v26" stroke="#AFCED3"/>
    <text x="283" y="401" class="tiny ink strong">Name</text><text x="553" y="401" class="tiny ink strong">Size</text><text x="733" y="401" class="tiny ink strong">Type</text><text x="913" y="401" class="tiny ink strong">Date Modified</text>
    <rect x="271" y="438" width="788" height="34" rx="3" fill="url(#selection)"/>
    <path d="M285 424h14v13h-14zM285 424v-3h6l3 3" fill="#FFE7A8" stroke="#B99B5B" stroke-width=".7"/><text x="309" y="434" class="small ink">Design ideas</text>
