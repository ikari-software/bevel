    <text x="84" y="798" class="small ink">Sign out</text><rect x="325" y="779" width="96" height="27" rx="7" fill="#F2B9B8" stroke="#DDA7A8"/><text x="340" y="798" class="small ink">Shut down</text>
  </g>
