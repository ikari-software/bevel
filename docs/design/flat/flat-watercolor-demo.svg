    <path d="M285 520h14v13h-14zM285 520v-3h6l3 3" fill="#D7EDEE" stroke="#88B7C0" stroke-width=".7"/><text x="309" y="531" class="small ink">Watercolor</text>
    <path d="M285 554h14v13h-14zM285 554v-3h6l3 3" fill="#FFE7A8" stroke="#B99B5B" stroke-width=".7"/><text x="309" y="565" class="small ink">Soft edges.svg</text>
    <!-- scrollbar -->
    <rect x="1030" y="410" width="14" height="293" fill="#EDF5F6" stroke="#C3D8DC"/>
    <rect x="1030" y="410" width="14" height="16" rx="3" fill="url(#button)" stroke="#9CBFC7"/><path d="M1037 417v4m-3-2h6" stroke="#286B82" stroke-width="1.1"/>
    <rect x="1030" y="468" width="14" height="84" rx="5" fill="url(#button)" stroke="#9CBFC7"/><circle cx="1037" cy="502" r="2" fill="#8EB6C0"/><circle cx="1037" cy="511" r="2" fill="#8EB6C0"/><circle cx="1037" cy="520" r="2" fill="#8EB6C0"/>
    <rect x="1030" y="687" width="14" height="16" rx="3" fill="url(#button)" stroke="#9CBFC7"/><path d="M1034 693h6m-6 3 3-6 3 6" stroke="#286B82" stroke-width="1.1"/>
    <!-- status -->
    <rect x="271" y="703" width="788" height="28" fill="#EAF3F4"/>
    <path d="M271 703h788" stroke="#C6DDE1"/><text x="286" y="721" class="tiny soft">5 items · 1 selected</text><text x="1041" y="721" text-anchor="end" class="tiny soft">Home</text>
  </g>

