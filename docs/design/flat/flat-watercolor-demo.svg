    <rect x="70" y="594" width="215" height="175" fill="#FFFFFF"/>
    <rect x="285" y="594" width="155" height="175" fill="#E7F1F2"/>
    <text x="84" y="614" class="micro soft">PINNED</text><text x="300" y="614" class="micro soft">PLACES</text>
    <path d="M84 628h13v12H84zM84 628v-3h6l3 3" fill="#FFE7A8" stroke="#B99B5B" stroke-width=".7"/><text x="107" y="638" class="small ink">File Manager</text>
    <path d="M84 657h13v12H84zM84 657v-3h6l3 3" fill="#D7EDEE" stroke="#88B7C0" stroke-width=".7"/><text x="107" y="667" class="small ink">Documents</text>
    <path d="M300 630h11v9h-11zM300 630v-2h5l2 2" fill="none" stroke="#88B7C0"/><text x="319" y="637" class="small ink">Pictures</text>
