    <g transform="translate(969 250)">
      <rect width="22" height="21" rx="6" fill="#F0F6F6" fill-opacity=".75" stroke="#FFFFFF"/>
      <path d="M6 12h10" stroke="#325A68" stroke-width="1.4" stroke-linecap="round"/>
