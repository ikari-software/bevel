    <rect x="612" y="72" width="180" height="32" rx="4" fill="#E9F2F4" stroke="#C3D8DC"/><rect x="622" y="76" width="52" height="24" rx="4" fill="url(#button)" stroke="#9CBFC7"/><circle cx="648" cy="88" r="2" fill="#8EB6C0"/><circle cx="656" cy="88" r="2" fill="#8EB6C0"/><circle cx="664" cy="88" r="2" fill="#8EB6C0"/>
    <text y="132" class="tiny soft">No gloss, no hard bevels: rounded plates, aqua separators, warm-yellow hover, soft progress.</text>
  </g>

  <text x="56" y="1128" class="micro soft">BEVEL FLAT / WHISTLER WATERCOLOR — VECTOR TARGET, NOT A RASTER SKIN</text>
</svg>
