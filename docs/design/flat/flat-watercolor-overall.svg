<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Flat — Whistler Watercolor source target</title>
  <desc id="desc">Source-led Flat target: compact Classic Shell Start composition, warm gray shell, white main menu column, blue-lilac places column, saturated blue selection and pale yellow new-item state.</desc>
  <defs>
    <linearGradient id="desktop" x2="0" y2="1"><stop stop-color="#D3D5CE"/><stop offset="1" stop-color="#B9BDB8"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#B9C7D7"/><stop offset=".18" stop-color="#A2A8E1"/><stop offset=".52" stop-color="#688ADE"/><stop offset=".86" stop-color="#A2A8E1"/><stop offset="1" stop-color="#B9C7D7"/></linearGradient>
    <linearGradient id="header" x2="0" y2="1"><stop stop-color="#BBC8F0"/><stop offset=".45" stop-color="#A2A8E1"/><stop offset="1" stop-color="#688ADE"/></linearGradient>
    <linearGradient id="footer" x2="0" y2="1"><stop stop-color="#D9E3F3"/><stop offset="1" stop-color="#A6AED5"/></linearGradient>
    <linearGradient id="start" x2="0" y2="1"><stop stop-color="#D7E1D0"/><stop offset=".5" stop-color="#B4C4AD"/><stop offset="1" stop-color="#94A48E"/></linearGradient>
    <linearGradient id="selection" x2="0" y2="1"><stop stop-color="#3F82D0"/><stop offset="1" stop-color="#316AC5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.ink{fill:#38393F}.white{fill:#fff}.muted{fill:#717370}.micro{font:600 10px Tahoma,Arial,sans-serif;letter-spacing:1.3px}.small{font:11px Tahoma,Arial,sans-serif}.tiny{font:10px Tahoma,Arial,sans-serif}.strong{font-weight:bold}</style>
  </defs>
  <rect width="1280" height="900" fill="#F1F1EF"/>
  <text x="42" y="50" class="micro muted">FLAT / SOURCE-LED OVERALL TARGET</text>
  <text x="42" y="82" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#38393F">Whistler Watercolor shell</text>
  <text x="44" y="105" class="small muted">Compact Classic Shell composition, vectorized for HiDPI. Pastel is not represented here.</text>

