syntax = "proto3";

package bevel.helper.v1;

// Single source of truth for the Bevel.App <-> BevelHelper IPC contract
// (gRPC over Unix domain sockets; see docs/spec/01-architecture.md §4).
//
// PLACEHOLDER — M0 structure only. The real contract splits by capability, mirroring
// the PAL: WindowService, TrayService, InputService, SessionService, ScriptingService
// (macOS), plus SupervisionService (Ping, GetHelperInfo). Event domains use one
// server-streaming RPC each, always opening with a Snapshot then Deltas (IPC-01), so
// reconnect == resubscribe. Additive-only evolution within v1 (IPC-02). Pixel frames
// travel over a shared-memory ring, never protobuf (§4.4).

// csharp_namespace maps generated stubs into Bevel.Ipc when code generation is wired.
option csharp_namespace = "Bevel.Ipc.V1";

service SupervisionService {
  rpc Ping(PingRequest) returns (PingReply);
}

// ── WindowService ────────────────────────────────────────────────────────────
// CGWindowList enumeration + AXUIElement-driven window control.
// Snapshot-then-deltas change stream (IPC-01).
service WindowService {
  // Enumerate all on-screen layer-0 windows with their TaskbarWindow descriptors.
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsReply);

  // Bring a window to the foreground.
  rpc Activate(WindowRef) returns (ActivateReply);

  // Minimize a window into the Dock.
  rpc Minimize(WindowRef) returns (MinimizeReply);

  // Restore a minimized window.
  rpc Restore(WindowRef) returns (RestoreReply);

  // Close a window.
  rpc Close(WindowRef) returns (CloseReply);

  // Quit (or force-quit) a whole app by bundle id (bevel-ww71): terminate() / forceTerminate().
  // The app-level action every taskbar button offers, including windowless-running ones.
  rpc TerminateApp(TerminateAppRequest) returns (TerminateAppReply);

  // Reposition/resize a window to an absolute target rect (device pixels, AppKit origin).
  rpc Reposition(RepositionRequest) returns (RepositionReply);

  // Capture a PNG thumbnail of a window's current pixels (ScreenCaptureKit), scaled to fit
  // max_width x max_height (0 = full size). Empty png if the window can't be captured.
  rpc CaptureWindow(CaptureWindowRequest) returns (CaptureWindowReply);

  // Subscribe to window events: opens with a full Snapshot, then streams
  // Deltas as AXObserver callbacks fire (backstopped by a reconciliation poll).
  rpc Changes(ChangesRequest) returns (stream WindowChange);
}

// ── TrayService ──────────────────────────────────────────────────────────────
// Menu-bar status-item mirroring (the "Ice technique", 02-macos-platform.md §5):
// CGWindowListCopyWindowInfo discovers status-item windows in the menu-bar layer;
// each is keyed by (ownerPID, windowNumber) and correlated to its NSRunningApplication.
// Icon pixels are the owning app's icon in limited mode (§5.5) or a per-window
// ScreenCaptureKit grab once Screen Recording is granted (§5.3, M3-B). Snapshot-then-
// deltas change stream (IPC-01).
service TrayService {
  // Enumerate the current menu-bar status items.
  rpc ListTrayItems(ListTrayItemsRequest) returns (ListTrayItemsReply);

  // Subscribe to tray changes: opens with a SNAPSHOT burst, then streams deltas.
  rpc Changes(TrayChangesRequest) returns (stream TrayChange);

  // Forward a click to the real status item (spec §5.5): the helper synthesizes a CGEvent at the
  // item's on-screen coordinates so the owning app reveals its menu/popover. Needs Accessibility.
  rpc ForwardClick(ForwardClickRequest) returns (ForwardClickReply);

  // Turn menu-bar consolidation on/off (Strategy C): enabled=true installs + expands the control item
  // to hide the real status items; enabled=false reveals them. Off is today's mirror behaviour.
  rpc SetConsolidation(SetConsolidationRequest) returns (SetConsolidationReply);
}

message ForwardClickRequest {
  string item_id = 1;
  enum Button {
    LEFT = 0;
    RIGHT = 2;
  }
  Button button = 2;
  // Modifier bitmask mirrored into the synthesized event: shift=1, control=2, option=4, command=8.
  uint32 modifiers = 3;
  // Single-item reveal (bevel-6fin): the item is currently hidden but the caller has just revealed the bar,
  // so the helper should session-tap Cmd-drag THIS item to a parked slot right of the control (survives the
  // caller's re-hide), press it to open its menu, and schedule a restore back to its origin.
  bool park = 4;
}

message ForwardClickReply {
  // False if the item is no longer present / on-screen (couldn't locate its coordinates).
  bool delivered = 1;
}

// A mirrored menu-bar status item.
message TrayItem {
  // Stable id within this helper session: "ownerPID:windowNumber".
  string item_id = 1;
  int32 owner_pid = 2;
  string owner_bundle_id = 3;
  string owner_name = 4;
  // Hover text (AX title / window name); may be empty.
  string tooltip = 5;
  // Screen rect of the real item (device px, AppKit bottom-left origin) — for click-forwarding.
  PixelRect bounds = 6;
  // Icon PNG: a per-window ScreenCaptureKit capture when live, else the owning app's
  // icon (limited mode, §5.5). Empty only if even the app icon is unavailable.
  bytes icon_png = 7;
  // False when icon_png is the generic app-icon fallback (Screen Recording not granted
  // or capture failed) rather than a live status-item capture.
  bool is_live = 8;
}

// TrayChange is the payload for the Changes server-streaming RPC: an initial burst of
// SNAPSHOT messages is the full item list, then ADDED/REMOVED/UPDATED deltas.
message TrayChange {
  enum Kind {
    SNAPSHOT = 0;
    ADDED = 1;
    REMOVED = 2;
    UPDATED = 3;
  }
  Kind kind = 1;
  TrayItem item = 2;
}

message ListTrayItemsRequest {}

message ListTrayItemsReply {
  repeated TrayItem items = 1;
}

message TrayChangesRequest {}

// SetConsolidation toggles Strategy C: hide the real menu bar into Bevel's tray, or reveal it.
message SetConsolidationRequest {
  bool enabled = 1;
}

message SetConsolidationReply {
  // True once the control item's hidden state matches the request.
  bool applied = 1;
}

// ── Common messages ──────────────────────────────────────────────────────────

message PingRequest {}

message PingReply {
  string helper_version = 1;
}

// Stable identifier for a window within this helper session.
message WindowRef {
  string window_id = 1;
}

// Complete descriptor of a window suitable for taskbar-style display.
message TaskbarWindow {
  string window_id = 1;
  string title = 2;
  string app_name = 3;
  string app_bundle_id = 4;
  int32 pid = 5;
  bool is_minimized = 6;
  bool is_focused = 7;
  PixelRect frame = 8;
  // App icon as PNG bytes (from the owning app's bundle id), or empty if unavailable.
  bytes app_icon_png = 9;
  // True for a synthetic "app-presence" entry: a regular app that is RUNNING but owns no window
  // (bevel-ww71). Its window_id is "app:<bundle_id>", frame is empty, and the taskbar renders it as a
  // dim icon-only button whose click reopens the app. Suppressed when a real window for the same bundle
  // exists, so the merge transition is duplicate-free.
  bool is_app_presence = 10;
}

message PixelRect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

// WindowChange is the payload for the Changes server-streaming RPC.
// An initial burst of SNAPSHOT messages represents the full window list;
// subsequent DELTA messages represent individual changes.
message WindowChange {
  enum Kind {
    SNAPSHOT = 0;
    OPENED = 1;
    CLOSED = 2;
    FOCUSED = 3;
    TITLE_CHANGED = 4;
    MINIMIZED = 5;
    DEMINIMIZED = 6;
    MOVED = 7;
  }
  Kind kind = 1;
  TaskbarWindow window = 2;
}

// ── Request / Reply wrappers ─────────────────────────────────────────────────

message ListWindowsRequest {}

message ListWindowsReply {
  repeated TaskbarWindow windows = 1;
}

message ActivateReply {}

message MinimizeReply {}

message RestoreReply {}

message CloseReply {}

message ChangesRequest {}

// Quit/force-quit an app by bundle id (bevel-ww71).
message TerminateAppRequest {
  string bundle_id = 1;
  bool force = 2;   // false = terminate() (graceful), true = forceTerminate() (SIGKILL-equivalent)
}

message TerminateAppReply {
  bool ok = 1;
}

// Reposition target: window + absolute device-pixel rect (AppKit bottom-left origin).
message RepositionRequest {
  string window_id = 1;
  PixelRect target = 2;
}

message RepositionReply {}

message CaptureWindowRequest {
  string window_id = 1;
  uint32 max_width = 2;
  uint32 max_height = 3;
}

message CaptureWindowReply {
  bytes png = 1;
}
