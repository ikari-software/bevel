name: ci

on:
  push:
    branches: [main, 'm0*']
  pull_request:
    branches: [main, 'm0*']

# Least privilege: the default GITHUB_TOKEN only needs read access to check out
# and build. Grant any extra scope per-job where actually required.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_VERSION: 10.0.301

jobs:
  # ── Framework-dependent build + test (fast PR gate) ─────────────────────────

  build-test:
    name: .NET ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Bevel.sln

      - name: Build
        run: dotnet build Bevel.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Bevel.sln --no-build --configuration Release

  # ── Self-contained publish per platform ─────────────────────────────────────

  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: bevel-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact-name: bevel-macos-x64
          - os: windows-latest
            rid: win-x64
            artifact-name: bevel-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained
        run: |
          dotnet publish src/Bevel.App/Bevel.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output .publish/${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: .publish/${{ matrix.artifact-name }}

  # ── Swift native helper build (macOS only) ──────────────────────────────────

  swift:
    name: Swift helper (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build --package-path native/helper-macos --configuration release

      - name: Upload BevelHelper binary
        uses: actions/upload-artifact@v4
        with:
          name: BevelHelper
          path: native/helper-macos/.build/release/BevelHelper

  # ── macOS signing + notarization lane ───────────────────────────────────────
  #
  #  Prerequisites (set these in the repo / org secrets):
  #    APPLE_DEVELOPER_ID       — Developer ID Installer cert (base64 .p12)
  #    APPLE_DEVELOPER_ID_PASSWORD — .p12 password (empty if none)
  #    APPLE_TEAM_ID            — 4TP7TPH2K6
  #    APPLE_NOTARIZE_KC_PROFILE — "bevel" (see notarytool store-profile)
  #
  #  Auto-skips when secrets are absent (forks / early setup).

  sign:
    name: Sign + notarize (macOS)
    runs-on: macos-latest
    needs: [publish, swift]
    steps:
      - uses: actions/checkout@v4

      - name: Check signing prerequisites
        id: check
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  APPLE_DEVELOPER_ID secret not set — skipping signing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS publish artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: bevel-macos-x64
          path: .publish/Bevel.app

      - name: Download BevelHelper
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: BevelHelper
          path: .publish/Bevel.app/Contents/MacOS/

      - name: Import Developer ID certificate
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          echo "$APPLE_DEVELOPER_ID" | base64 --decode > /tmp/dev-id.p12
          security create-keychain -p ci build-ci.keychain
          security default-keychain -s build-ci.keychain
          security unlock-keychain -p ci build-ci.keychain
          security import /tmp/dev-id.p12 \
            -k build-ci.keychain \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k ci build-ci.keychain

      - name: Codesign
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --sign "$APPLE_TEAM_ID" \
            --deep .publish/Bevel.app

      - name: Notarize
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_NOTARIZE_KC_PROFILE: ${{ secrets.APPLE_NOTARIZE_KC_PROFILE }}
        run: |
          ditto -c -k --keepParent .publish/Bevel.app /tmp/Bevel.zip
          xcrun notarytool submit /tmp/Bevel.zip \
            --keychain-profile "$APPLE_NOTARIZE_KC_PROFILE" \
            --wait

      - name: Upload signed bundle
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Bevel-signed
          path: .publish/Bevel.app
