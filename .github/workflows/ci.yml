name: ci

on:
  push:
    branches: [main, 'm0*']
  pull_request:
    branches: [main, 'm0*']

# Least privilege: the default GITHUB_TOKEN only needs read access to check out
# and build. Grant any extra scope per-job where actually required.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_VERSION: 10.0.301

jobs:
  # ── Framework-dependent build + test (fast PR gate) ─────────────────────────

  build-test:
    name: .NET ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Bevel.sln

      - name: Build
        # Dead-code gate: these diagnostics are all at zero today, so treat them as ERRORS — new unused
        # members / dead locals / unreachable code fail CI instead of accumulating silently (the class of
        # rot found in the ToolbarIcons audit). Noisier nullability (CS86xx) and obsolete-API (CS0618) stay
        # warnings; the drag-drop CS0618 migration is tracked as its own bead. The ;-list is %3B-escaped so
        # MSBuild doesn't parse each code as a separate command-line switch (MSB1006).
        run: dotnet build Bevel.sln --no-restore --configuration Release -p:WarningsAsErrors=CS0168%3BCS0169%3BCS0219%3BCS0414%3BCS0649%3BCS0162%3BCS8321

      - name: Test
        run: dotnet test Bevel.sln --no-build --configuration Release

  # ── Windows runtime smoke: the split core actually boots + binds UDS (bevel-ncfp.12) ──────────
  # The matrix above only builds/tests. This proves the Windows PAL core role starts headless on real
  # Windows and binds its Unix-domain-socket endpoint (the load-bearing U1+U2 runtime path) — a class of
  # failure a cross-platform build can't catch. WinExe has no console, so child stdout is captured via
  # the process handle, not a console window.
  windows-smoke:
    name: Windows runtime smoke (core boots + UDS binds)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Bevel.App
        run: dotnet build src/Bevel.App/Bevel.App.csproj --configuration Release

      - name: Boot --role=core --pal=windows and assert the UDS endpoint binds
        shell: pwsh
        run: |
          $dll   = "src/Bevel.App/bin/Release/net10.0/Bevel.App.dll"
          $dir   = Join-Path $env:LOCALAPPDATA "bevel\bevel-core"
          $sock  = Join-Path $dir "core.sock"     # the bound AF_UNIX reparse-point file proves StartAsync bound
          $token = Join-Path $dir "core.token"    # the nonce file proves ForServer() ran
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

          $p = Start-Process dotnet -ArgumentList $dll,"--role=core","--pal=windows" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {   # up to ~30s
              if ((Test-Path $sock) -and (Test-Path $token)) { $ok = $true; break }
              if ($p.HasExited) { throw "core exited early (code $($p.ExitCode)) before binding UDS" }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "core.sock/core.token never appeared — the Windows PAL core did not bind its UDS endpoint in 30s" }
            Write-Host "OK: Windows PAL core booted headless and bound its UDS endpoint ($sock)."
          }
          finally {
            if (-not $p.HasExited) { $p.Kill($true) }
          }

  # ── Self-contained publish per platform ─────────────────────────────────────

  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: bevel-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact-name: bevel-macos-x64
          - os: windows-latest
            rid: win-x64
            artifact-name: bevel-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained
        # bash on all runners: the \-continuations are POSIX; the Windows default (PowerShell) parses
        # them as line breaks and errors. GitHub's windows-latest ships Git Bash, so this is portable.
        shell: bash
        run: |
          dotnet publish src/Bevel.App/Bevel.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:BevelPackaging=true \
            --output .publish/${{ matrix.artifact-name }}

      - name: Upload artifact
        # Only on release tags. Every main push was parking ~180 MB × 3 RIDs + helper into Actions
        # artifact storage (org quota is 2 GB shared); once full, every CI run went red on upload
        # and then on the Actions minutes budget. PRs still gate on the publish step; release-macos.yml
        # builds its own signed DMG and does not consume these artifacts.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: .publish/${{ matrix.artifact-name }}
          retention-days: 3

  # ── Swift native helper build (macOS only) ──────────────────────────────────

  swift:
    name: Swift helper (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build --package-path native/helper-macos --configuration release

      - name: Upload BevelHelper binary
        # Tags only — see publish job. Keeps Actions artifact storage from filling on every main push.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BevelHelper
          path: native/helper-macos/.build/release/BevelHelper
          retention-days: 3

  # ── Theme token codegen drift check (bevel-51t / MET-01) ────────────────────
  #
  #  Regenerates Tokens.axaml + ThemeTokens.cs from theme.json (the single source of
  #  truth) and fails if the checked-in files differ — someone edited a generated file
  #  by hand, or edited theme.json without running tools/ThemeGen.

  theme-drift:
    name: Theme token codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Regenerate theme tokens
        run: dotnet run --project tools/ThemeGen

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- src/Bevel.Themes.Win2000/Tokens.axaml src/Bevel.UI/ThemeTokens.cs third_party/classic-avalonia/Classic.Avalonia.Theme/Colors; then
            echo "::error::Generated theme tokens or scheme dictionaries drifted from theme.json/schemes.json. Edit the JSON and run 'dotnet run --project tools/ThemeGen', then commit the result."
            exit 1
          fi

  # ── Landing-page screenshot drift check ─────────────────────────────────────
  #
  #  site/shots/ is build OUTPUT that happens to be committed, and committed output rots.
  #  Three shots had: theme-win2000.png was a one-off hand-run with no test behind it,
  #  infopane-win9x.png was harvested while text still rendered aliased, and
  #  startmenu-win2000.png predated the "Show Desktop" row. None of it was visible in review.
  #
  #  Runs on macOS because glyph rasterisation is platform-specific: a shot harvested on
  #  Linux differs byte-for-byte from the committed one even when nothing is wrong.

  site-shots-drift:
    name: Landing page screenshot drift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Re-harvest and compare
        run: |
          if ! ./site/harvest-shots.sh --check; then
            echo "::error::site/shots/ is stale, or index.html declares the wrong size for a shot. Run './site/harvest-shots.sh' and commit the result."
            exit 1
          fi

  # ── Proto codegen drift check (bevel-vgg) ───────────────────────────────────
  #
  #  Regenerates the Swift protobuf output from proto/bevel.helper.v1.proto and fails
  #  if it differs from the checked-in Generated/ dir, so the Swift/C# wire contract
  #  can't silently drift (someone editing the .proto without regenerating, or editing
  #  Generated/ by hand). If this fails because Homebrew bumped protoc/swift-protobuf
  #  to a version that formats output differently, re-run generate-proto.sh locally
  #  with the matching versions and commit the result — the diff itself is the signal.

  proto-drift:
    name: Proto codegen drift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc + Swift plugin
        run: brew install protobuf swift-protobuf

      - name: Regenerate Swift protobuf output
        run: ./native/helper-macos/generate-proto.sh

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- native/helper-macos/Sources/BevelHelper/Generated; then
            echo "::error::Generated Swift protobuf output drifted from proto/bevel.helper.v1.proto. Run native/helper-macos/generate-proto.sh and commit the result."
            exit 1
          fi

  # ── macOS signing + notarization lane ───────────────────────────────────────
  #
  #  Prerequisites (set these in the repo / org secrets):
  #    APPLE_DEVELOPER_ID       — Developer ID Installer cert (base64 .p12)
  #    APPLE_DEVELOPER_ID_PASSWORD — .p12 password (empty if none)
  #    APPLE_TEAM_ID            — 4TP7TPH2K6
  #    APPLE_NOTARIZE_KC_PROFILE — "bevel" (see notarytool store-profile)
  #
  #  Auto-skips when secrets are absent (forks / early setup).

  sign:
    name: Sign + notarize (macOS)
    runs-on: macos-latest
    needs: [publish, swift]
    # Signing + notarization is a RELEASE step, not a per-push one (notarytool submits to Apple and
    # waits). Only run it for v* tags — the dedicated release-macos.yml lane owns real releases
    # (bevel-9po). On ordinary pushes/PRs this job is skipped, so an incomplete/placeholder org-level
    # signing secret can't turn every CI run red.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check signing prerequisites
        id: check
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  APPLE_DEVELOPER_ID secret not set — skipping signing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS publish artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: bevel-macos-x64
          path: .publish/Bevel.app

      - name: Download BevelHelper
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: BevelHelper
          path: .publish/Bevel.app/Contents/MacOS/

      - name: Import Developer ID certificate
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          echo "$APPLE_DEVELOPER_ID" | base64 --decode > /tmp/dev-id.p12
          security create-keychain -p ci build-ci.keychain
          security default-keychain -s build-ci.keychain
          security unlock-keychain -p ci build-ci.keychain
          security import /tmp/dev-id.p12 \
            -k build-ci.keychain \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k ci build-ci.keychain

      - name: Codesign
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --sign "$APPLE_TEAM_ID" \
            --deep .publish/Bevel.app

      - name: Notarize
        if: steps.check.outputs.skip == 'false'
        env:
          APPLE_NOTARIZE_KC_PROFILE: ${{ secrets.APPLE_NOTARIZE_KC_PROFILE }}
        run: |
          ditto -c -k --keepParent .publish/Bevel.app /tmp/Bevel.zip
          xcrun notarytool submit /tmp/Bevel.zip \
            --keychain-profile "$APPLE_NOTARIZE_KC_PROFILE" \
            --wait

      - name: Upload signed bundle
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Bevel-signed
          path: .publish/Bevel.app
          retention-days: 7
