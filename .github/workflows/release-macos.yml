# macOS release lane (M5 / bevel-nsk): the same four packaging scripts run by hand, automated.
# The only thing CI adds is credential provisioning — the Developer ID cert is imported from a
# secret into an EPHEMERAL keychain per run, and notarization uses an App Store Connect API key
# (non-interactive, revocable). Identifiers are the M0-frozen values baked into the scripts/plist.
#
# Required secrets (Environment "release"):
#   SIGNING_CERT_P12       base64 of the Developer ID Application .p12
#   SIGNING_CERT_PASSWORD  password for that .p12
#   KEYCHAIN_PASSWORD      any string — password for the throwaway keychain
#   NOTARY_KEY_P8          base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID          the key's Key ID
#   NOTARY_ISSUER          the API issuer UUID
name: release-macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: macos-latest
    environment: release   # secrets live behind a gated environment
    permissions:
      contents: write   # required to create the Release and upload its assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"   # strip the leading v from a vX.Y.Z tag
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID cert into an ephemeral keychain
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PW: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KC_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/bevel-signing.keychain-db"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN"
          # Make the ephemeral keychain the default search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Provision notarization API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build → sign → notarize → DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TIMESTAMP: '1'
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          bash packaging/macos/build-app.sh
          bash packaging/macos/sign-app.sh
          bash packaging/macos/notarize-app.sh
          bash packaging/macos/make-dmg.sh

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/bevel-signing.keychain-db"

      # The DMG is uploaded as a short-lived artifact on EVERY run; the `release` job below
      # attaches it (plus the win/linux zips) to the GitHub Release on tag builds. Release
      # assets are free and unmetered, unlike Actions artifacts which bill against the org's
      # 2 GB Actions storage and then silently expire.
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bevel-macos-${{ steps.ver.outputs.version }}
          path: dist/Bevel-*.dmg
          if-no-files-found: error
          retention-days: 7

  # Windows/Linux release zips (bevel-oedd): the v0.1.0 win/linux zips were hand-uploaded; this
  # matrix publishes them per RID (cross-publish from ubuntu works — same command as ci.yml's
  # publish job) and zips them as Bevel-<version>-<rid>.zip, the names v0.1.0 shipped under.
  zips:
    name: Zip ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish src/Bevel.App/Bevel.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:BevelPackaging=true \
            --output ".publish/bevel-${{ matrix.rid }}"

      - name: Zip
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd ".publish/bevel-${{ matrix.rid }}"
          zip -qr "$GITHUB_WORKSPACE/dist/Bevel-$V-${{ matrix.rid }}.zip" .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bevel-zip-${{ matrix.rid }}-${{ steps.ver.outputs.version }}
          path: dist/Bevel-*-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  # Tag builds only: create the GitHub Release and attach the DMG + both zips. Manual
  # (workflow_dispatch) runs have no tag, so they keep their 7-day artifacts instead.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, zips]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Bevel-*
          merge-multiple: true

      - name: Create release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          shopt -s nullglob
          assets=(dist/Bevel-*)
          if [ ${#assets[@]} -eq 0 ]; then echo '::error::no release assets downloaded'; exit 1; fi
          # Idempotent: if the release was already created (e.g. via the web UI when the tag
          # was pushed), upload assets to it instead of failing on gh release create.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading assets to it"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Bevel Desktop $VERSION" \
              --generate-notes \
              --verify-tag
          fi
