# Deploys the Bevel landing page (site/) to Deno Deploy (new platform).
#
# Custom domain bevel.run is attached in the Deno Deploy dashboard (app bevel-site), NOT here.
# Alias: ikari.software/bevel-desktop → 301 to https://bevel.run/ (ikari-software repo).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check
        working-directory: site
        run: |
          deno check main.ts
          deno fmt --check main.ts

      - name: Verify every referenced screenshot exists
        working-directory: site
        run: |
          missing=0
          for f in $(grep -oE 'shots/[a-zA-Z0-9._-]+' index.html | sort -u); do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          exit $missing

      - name: Deploy
        working-directory: site
        run: |
          deno deploy --org ikari --app bevel-site --prod --non-interactive --json
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
