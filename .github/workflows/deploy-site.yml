# Deploys the Bevel landing page (site/) to Deno Deploy.
#
# Modelled on the ikari-software workflow, minus the build step: the page is one self-contained HTML
# file plus real screenshots harvested from the Render* tests, so there is nothing to compile and no
# framework to boot. Keeping it buildless means a re-harvested screenshot is one commit from live.
#
# The custom domain bevel.run is attached in the Deno Deploy dashboard, NOT here.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one rather than racing it.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by deployctl's OIDC auth
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Catches a broken server before it reaches the edge. The page itself is static, so this is the
      # only thing here that can fail at runtime.
      - name: Check
        working-directory: site
        run: |
          deno check main.ts
          deno fmt --check main.ts

      # Every image the page references must exist. A missing screenshot is invisible in review and
      # obvious on the live site, which is the wrong way round.
      - name: Verify every referenced screenshot exists
        working-directory: site
        run: |
          missing=0
          for f in $(grep -oE 'shots/[a-zA-Z0-9._-]+' index.html | sort -u); do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          exit $missing

      - name: Deploy
        working-directory: site
        run: |
          deno install -gArf jsr:@deno/deployctl
          deployctl deploy --project=bevel-site --entrypoint=main.ts --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
